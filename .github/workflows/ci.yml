name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.arch }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.9", "3.12"]
        include:
          - os: ubuntu-24.04
            arch: x64
            machine: x86_64
            file-magic: x86-64
          - os: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            file-magic: ARM aarch64
    env:
      # fail instead of skip if the C compiler or kernel headers are missing
      SYSVITALS_REQUIRE_UAPI_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert the interpreter matches the runner architecture
        shell: bash
        run: |
          uname -m
          python -c "import platform; print(platform.machine())"
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
          info="$(file "$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')")"
          echo "$info"
          echo "$info" | grep -q "${{ matrix.file-magic }}"
      - name: Unit and integration tests (NVMe ABI, SMART parser, --dump, TUI in a pty)
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: --version and --dump
        shell: bash
        run: |
          python sysvitals.py --version
          python sysvitals.py --dump 2>&1 | tee dump.txt
          for section in "SysVitals" "Top processes by CPU" "Network:" "Listening ports" "Disks" "Mounts"; do
            grep -q "$section" dump.txt || { echo "missing section: $section"; exit 1; }
          done
          if grep -q Traceback dump.txt; then echo "traceback in --dump output"; exit 1; fi
      - name: --dump as root
        shell: bash
        run: |
          ls -d /sys/block/nvme* 2>/dev/null || echo "no NVMe drive on this runner: real SMART reads cannot be exercised here"
          sudo "$(command -v python)" sysvitals.py --dump 2>&1 | tee dump-root.txt
          if grep -q Traceback dump-root.txt; then echo "traceback in --dump output"; exit 1; fi

  # The .rpm (Fedora, RHEL, openSUSE) and the Arch package. SysVitals is one
  # Python script, so both are architecture-independent: built once here,
  # installed and run on x86_64 and aarch64 by the "distros" job.
  packages:
    name: rpm and Arch packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NFPM_VERSION: '2.48.0'
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Package version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' sysvitals.py)"
          test -n "$version"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::release $TAG does not match VERSION $version in sysvitals.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the .rpm and the Arch package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          packaging/linux-distros/build-tree.sh "$RUNNER_TEMP/root"
          packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" amd64 dist
      - uses: actions/upload-artifact@v7
        with:
          name: distros
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # Installs the packages on Fedora, openSUSE Tumbleweed and Arch Linux and
  # runs packaging/linux-distros/smoke.py there. arm64 has no official Arch
  # image, so the Arch package gets a static check on that leg.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: distros
          path: dist
      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

  # AUR recipe: PKGBUILD + .SRCINFO, rendered with the checksum of GitHub's
  # archive of the release tag and proven with makepkg on archlinux:latest.
  # Before the tag exists, a git archive of this commit stands in (its
  # checksum differs from GitHub's, so that PKGBUILD is a build check only).
  aur:
    name: AUR PKGBUILD
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Source archive
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = release ] || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/source.tar.gz" "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$tag.tar.gz"
          else
            echo "::notice::tag $tag does not exist yet; checking the PKGBUILD against git archive HEAD"
            git archive --format=tar.gz --prefix="SysVitals-$VERSION/" -o "$RUNNER_TEMP/source.tar.gz" HEAD
          fi
          tar -tzf "$RUNNER_TEMP/source.tar.gz" "SysVitals-$VERSION/sysvitals.py"
      - name: Render and check the PKGBUILD
        run: packaging/arch/aur.sh "$RUNNER_TEMP/source.tar.gz" dist
      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Releases are published by hand. This attaches the packages to a newly
  # published release, skipping any name the release already has. On other
  # events it only checks that every expected file was built.
  release:
    name: Release assets
    needs: [test, packages, distros, aur]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Check the release assets
        run: |
          ls -l assets
          for f in "sysvitals-$VERSION-1.noarch.rpm" "sysvitals-$VERSION-1-any.pkg.tar.zst" \
                   "sysvitals-$VERSION-aur.tar.gz"; do
            test -f "assets/$f" || { echo "::error::missing $f"; exit 1; }
          done
          test "$(ls assets | wc -l)" -eq 3
      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in assets/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF -- "$name"; then
              echo "skip $name (already on the release)"
            else
              echo "upload $name"
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
