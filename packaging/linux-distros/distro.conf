# Package metadata for the Linux distribution packages (.rpm, Arch, AUR
# PKGBUILD). Sourced by bash from packaging/linux-distros/build-tree.sh,
# pack.sh, verify.sh and packaging/arch/aur.sh.

NAME=sysvitals
APP_NAME=SysVitals
GITHUB_REPO=Dhiva-Labs/SysVitals
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Processes, connections, open ports and SSD health in one terminal tool'
DESCRIPTION='SysVitals combines an htop-style process monitor, a netstat-style socket list with owning processes, a listening-ports view and NVMe/SATA SMART disk health in one curses TUI. It is a single Python script with no dependencies beyond the standard library; run it with sudo for full NVMe SMART data, or use --dump for a plain-text snapshot.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/SysVitals
LICENSE=MIT
LICENSE_FILE=LICENSE

# A pure Python script: one noarch .rpm and one "any" Arch package, built
# once and installed on x86_64 and aarch64.
ARCH_INDEPENDENT=1

# rpm: the interpreter, plus curses where the distribution splits it out of
# the standard library. openSUSE ships curses as python3-curses next to
# python3-base; Fedora keeps it in python3-libs and has no python3-base, so
# the condition only ever applies on openSUSE.
RPM_REQUIRES=(/usr/bin/python3 'python(abi) >= 3.8' '(python3-curses if python3-base)')
# smartctl is only used for SATA drives (NVMe is read through the kernel).
RPM_RECOMMENDS=(smartmontools)
# Arch's python package includes curses.
ARCH_DEPENDS=(python)
ARCH_OPTDEPENDS=('smartmontools: SMART health for SATA drives')

APPIMAGE=0                   # terminal tool: no AppImage or Flatpak

# Smoke test run in each distribution container by verify.sh (and after the
# AUR build): --version, --dump and the curses TUI through every tab in a pty.
GUI_CMD=''
SMOKE_CMD='python3 /linux-distros/smoke.py'
